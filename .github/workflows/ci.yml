name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install .NET MAUI workload
        run: dotnet workload install maui-android
      - name: Restore
        run: dotnet restore src/Plugin.Maui.Rotatable/Plugin.Maui.Rotatable.csproj -p:TargetFramework=net10.0
      - name: Build
        run: dotnet build src/Plugin.Maui.Rotatable/Plugin.Maui.Rotatable.csproj -f net10.0 -c Release --no-restore --no-incremental
