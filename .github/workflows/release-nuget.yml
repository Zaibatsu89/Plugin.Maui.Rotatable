name: Create a (Pre)release on NuGet

on:
  push:
    tags:
      - 'v*'

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  release-nuget:
  
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore workloads
        run: dotnet workload restore src\Plugin.Maui.Rotatable.sln
      - name: Verify commit exists in origin/main
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Commit $env:GITHUB_SHA not in origin/main" }
      - name: Get version information from tag
        id: get_version
        run: |
          $version="${{github.ref_name}}".TrimStart("v")
          "version-without-v=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Restore
        run: dotnet restore src\Plugin.Maui.Rotatable\Plugin.Maui.Rotatable.csproj
      - name: Build
        run: dotnet build src\Plugin.Maui.Rotatable\Plugin.Maui.Rotatable.csproj -c Release --no-incremental
      - name: Pack
        run: dotnet pack src\Plugin.Maui.Rotatable\Plugin.Maui.Rotatable.csproj -c Release --no-build -p:PackageVersion=${{ steps.get_version.outputs.version-without-v }} -o artifacts
      - name: Push
        run: dotnet nuget push artifacts\*.nupkg -s https://api.nuget.org/v3/index.json -k ${{ secrets.NUGET_API_KEY }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
